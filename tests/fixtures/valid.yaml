# Test fixture: a fully compliant OpenAPI 3.1 document.
# Running spectral against this should produce zero errors (warnings about
# missing contact/servers are also gone since both are populated).
#
# Run: npx @stoplight/spectral-cli@latest lint tools/octo-api/test-fixtures/valid.yaml --ruleset tools/octo-api/spectral.yaml

openapi: 3.1.0

info:
  title: Octo Server API (test fixture)
  version: 1.0.0
  description: Sample valid spec for spectral rule regression
  contact:
    name: OCTO Team
    email: support@octo.example
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://api.octo.example/v1
    description: Production

tags:
  - name: matter
    description: matter operations

components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
  schemas:
    MatterResp:
      type: object
      properties:
        matter_id:
          type: string
        title:
          type: string
        is_active:                            # boolean prefix ✅
          type: boolean
        avatar_url:                           # URL suffix ✅
          type: string
          format: uri
        created_at:                           # time _at suffix ✅
          type: string
          format: date-time
    EnvelopeData:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/MatterResp'
    EnvelopeError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    EnvelopeCursorList:                       # R5 cursor pagination shape ✅
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MatterResp'
        pagination:
          type: object
          properties:
            has_more:
              type: boolean
            next_cursor:
              type: string
    EnvelopeOffsetList:                       # R5 offset pagination shape ✅
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MatterResp'
        pagination:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            page_size:
              type: integer
    BatchCreateMattersReq:                    # R11 batch body ✅
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MatterResp'

paths:
  # ----- Boundary pass cases -----
  /summary_80_chars:                          # boundary: exactly 80 chars ✅
    get:
      operationId: summary_80_chars.get
      summary: "Aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      description: Boundary case for summary length.
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'

  # Four-role URL framework: rule allows all of these (no resource-singular
  # check). PR review judges design appropriateness per api-spec.md §A.

  /internal/notifications:                    # audience prefix + resource ✅
    get:
      summary: List internal notifications
      description: Internal-only endpoint for service-to-service notifications.
      tags: [matter]
      operationId: internal.notification.list
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'

  /obo/grants:                                # domain qualifier + resource ✅
    get:
      summary: List OBO grants
      description: List on-behalf-of authorization grants.
      tags: [matter]
      operationId: obo.grant.list
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'

  /manager/backups:                           # audience prefix + resource ✅
    get:
      summary: List system backups
      description: Management surface for system backup operations.
      tags: [matter]
      operationId: manager.backup.list
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'

  /admin/users/{user_id}:                     # audience prefix + resource + id ✅
    get:
      summary: Get user via admin
      description: Admin-only user view with extended audit metadata.
      tags: [matter]
      operationId: admin.user.get
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'

  /matters/{matter_id}/assignees:             # nested plural segment ✅
    get:
      summary: List assignees on matter
      description: List the assignees attached to a matter.
      tags: [matter]
      operationId: matter.assignee.list       # 3-part operationId (resource.sub.verb) ✅
      parameters:
        - name: matter_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'

  /matters/{matter_id}:                       # plural + _id suffix ✅
    get:
      summary: Get matter by id              # capital English verb ✅
      description: Retrieve a single matter resource owned by the caller.
      tags: [matter]                          # single lowercase tag ✅
      operationId: matter.get                 # <resource>.<verb> ✅
      security:
        - Bearer: []                          # auth declared ✅
      parameters:
        - name: matter_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'   # envelope ✅
        '401':                                # auth has-401 ✅, R2 code in description ✅
          description: AUTH_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'  # error envelope ✅
        '403':                                # auth has-403 ✅
          description: "FORBIDDEN: not owner"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'
        '404':                                # auth has-404 ✅
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'
        '500':                                # auth has-500 ✅
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'

  # ----- R5 pagination pass cases -----
  /matters:                                   # cursor list: params + shape matched ✅
    get:
      summary: List matters
      description: List matters visible to the caller using cursor pagination.
      tags: [matter]
      operationId: matter.list
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeCursorList'

  /reports:                                   # offset list: params + shape matched ✅
    get:
      summary: List reports
      description: List reports with page-number pagination for admin tables.
      tags: [matter]
      operationId: report.list
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeOffsetList'

  # ----- R11 batch pass case -----
  /matters/_batch:                            # POST-only + requestBody ✅
    post:
      summary: Batch create matters
      description: Create up to 100 matters in one call with all-or-nothing semantics.
      tags: [matter]
      operationId: matter.batch_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateMattersReq'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
        '400':
          description: "VALIDATION_ERROR: details.failed_index"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'

  # ----- H deprecation pass case -----
  /legacy_matters:                            # deprecated with guidance ✅
    get:
      summary: List matters (legacy)
      description: Deprecated as of 2026-06-01. Removal planned 2026-09-01. Use GET /matters instead.
      deprecated: true
      tags: [matter]
      operationId: matter.list_legacy
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeCursorList'
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
