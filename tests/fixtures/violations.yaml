# Test fixture: deliberately violate every OCTO custom rule.
# Each path/operation triggers a known rule. Used to verify spectral.yaml.
#
# Run: npx @stoplight/spectral-cli@latest lint tools/octo-api/test-fixtures/violations.yaml --ruleset tools/octo-api/spectral.yaml

openapi: 3.0.0                                  # violation: octo-openapi-version (not 3.1.x)

info:
  title: Test Fixture
  version: 1.0.0
  description: deliberate violations

components:
  schemas:
    Envelope_Data:                              # baseline envelope shape
      type: object
      properties:
        data:
          type: object
    Envelope_Error:
      type: object
      properties:
        error:
          type: object
    BadSchema:
      type: object
      properties:
        userId:                                 # violation: octo-schema-property-snake-case (camelCase)
          type: string
        createdTime:                            # violation: octo-schema-time-at-suffix (missing _at)
          type: string
          format: date-time
        avatar:                                 # violation: octo-schema-url-suffix (missing _url)
          type: string
          format: uri
        active:                                 # violation: octo-schema-boolean-prefix (no is_/has_/can_)
          type: boolean
        start_time:                             # violation: octo-schema-no-legacy-time-suffix (_time)
          type: string
        login_ts:                               # violation: octo-schema-no-legacy-time-suffix (_ts)
          type: integer

tags:
  - name: matter
    description: matter operations
  - name: bot
    description: bot operations

paths:
  # ----- @Summary violations -----
  /no_summary:                                  # routine snake_case
    get:
      operationId: no_summary.get
      tags: [matter]
      # missing summary → octo-summary-required
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'

  /long_summary:
    get:
      operationId: long_summary.get
      summary: "This is an extremely long summary that exceeds the eighty character limit imposed by R13 rule"  # >80 → octo-summary-length-exceeded
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'

  /lowercase_summary:
    get:
      operationId: lowercase_summary.get
      summary: "get matter list"                # not capital first → octo-summary-english-verb
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'

  # ----- @Tags violations -----
  /multi_tags:
    get:
      operationId: multi_tags.get
      summary: List items
      tags: [matter, bot]                       # → octo-tags-single
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'

  /upper_tag:
    get:
      operationId: upper_tag.get
      summary: List items
      tags: [Matter]                            # → octo-tags-lowercase
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'

  # ----- @ID format violation -----
  /bad_id:
    get:
      operationId: getMatters                   # camelCase, not <resource>.<verb> → octo-operation-id-format
      summary: List matters
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'

  # ----- Path violations -----
  /Users:                                       # camelCase path → octo-path-snake-case
    get:
      operationId: users.get
      summary: List users
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'

  # ----- Path parameter violations -----
  /matters/{matter_no}:                         # _no suffix → octo-path-param-no-uid (legacy)
    get:                                        # also octo-path-param-id-suffix (no _id)
      operationId: matters.bad_param
      summary: Get matter by no
      tags: [matter]
      parameters:
        - name: matter_no
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'

  /matters/{uid}:                               # uid → octo-path-param-no-uid
    get:
      operationId: matters.uid_param
      summary: Get matter by uid
      tags: [matter]
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'

  # ----- envelope violations -----
  # All 5 envelope structural failure modes; each triggers either
  # octo-response-success-shape (2xx needs `data`) or
  # octo-response-error-shape (4xx/5xx needs `error`).

  /raw_success:                                 # $ref to non-envelope schema lacking `data`
    get:
      operationId: raw_success.get
      summary: Returns raw data
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadSchema'

  /bare_array:                                  # bare array, no top-level `data` property
    get:
      operationId: bare_array.get
      summary: Returns bare array
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BadSchema'

  /bare_object:                                 # inline object with non-`data` property
    get:
      operationId: bare_object.get
      summary: Returns bare inline object
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  foo:
                    type: string

  /wrong_envelope_in_success:                   # 200 returns Error envelope → lacks `data`
    get:
      operationId: wrong_envelope_in_success.get
      summary: Wrong envelope direction (200 uses Error)
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'

  /wrong_envelope_in_error:                     # 400 returns Data envelope → lacks `error`
    get:
      operationId: wrong_envelope_in_error.get
      summary: Wrong envelope direction (400 uses Data)
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'
        '400':
          description: bad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'

  /raw_error:                                   # 400 returns non-envelope schema lacking `error`
    get:
      operationId: raw_error.get
      summary: Returns raw error
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadSchema'

  # ----- Boundary cases -----
  /empty_summary:                               # boundary: empty string is falsy → octo-summary-required
    get:
      operationId: empty_summary.get
      summary: ""
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'

  /summary_81_chars:                            # boundary: exactly 81 chars → length-exceeded
    get:
      operationId: summary_81_chars.get
      summary: "Aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'

  /zero_tags:                                   # boundary: empty array → tags-single (min)
    get:
      operationId: zero_tags.get
      summary: List items
      tags: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'

  /three_tags:                                  # boundary: 3 tags → tags-single (max)
    get:
      operationId: three_tags.get
      summary: List items
      tags: [matter, bot, matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'

  /opid_one_part:                               # boundary: 1-part operationId → operation-id-format
    get:
      operationId: matter
      summary: List items
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'

  /opid_four_parts:                             # boundary: 4-part operationId → operation-id-format
    get:
      operationId: a.b.c.d
      summary: List items
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'

  # ----- Security violations -----
  /auth_no_401:
    get:
      operationId: auth_no_401.get
      summary: Authenticated but missing 401
      tags: [matter]
      security:
        - Bearer: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'
        # missing 401 → octo-auth-has-401
        # missing 403 → octo-auth-has-403
        # missing 404 → octo-auth-has-404
        # missing 500 → octo-auth-has-500

  # ----- @Router relative-path violation (R12) -----
  /v1/users:                                    # /v1 prefix doubles with servers:/v1 → octo-path-no-version-prefix
    get:
      operationId: user.list
      summary: List users with doubled prefix
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'

  # ----- @Success required violation (R13) -----
  /no_success:                                  # only 4xx declared → octo-success-response-required
    get:
      operationId: no_success.get
      summary: Declares no success response
      tags: [matter]
      responses:
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Error'

  # ----- Pagination violations (R5) -----
  /bad_pagination:                              # pagination matches neither cursor nor offset → octo-pagination-shape
    get:
      operationId: bad_pagination.list
      summary: List with malformed pagination
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object
                    properties:
                      next_offset:              # neither has_more nor total/page/page_size
                        type: integer

  /cursor_with_total:                           # cursor mode carrying total → octo-pagination-shape (anti-pattern)
    get:
      operationId: cursor_with_total.list
      summary: Cursor list leaking total
      tags: [matter]
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object
                    properties:
                      has_more:
                        type: boolean
                      next_cursor:
                        type: string
                      total:                    # forbidden in cursor mode
                        type: integer

  /cursor_missing_param:                        # cursor response without cursor query param → octo-pagination-params-match
    get:
      operationId: cursor_missing_param.list
      summary: Cursor list without cursor param
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object
                    properties:
                      has_more:
                        type: boolean
                      next_cursor:
                        type: string

  /offset_missing_param:                        # offset response without page query param → octo-pagination-params-match
    get:
      operationId: offset_missing_param.list
      summary: Offset list without page param
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      page_size:
                        type: integer

  # ----- Batch violations (R11) -----
  /items/_batch:                                # GET on _batch endpoint → octo-batch-post-only
    get:
      operationId: item.batch_list
      summary: Batch endpoint wrongly exposing GET
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'

  /nobody/_batch:                               # POST _batch without requestBody → octo-batch-requires-body
    post:
      operationId: nobody.batch_create
      summary: Batch endpoint without body
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'

  # ----- @Description duplicates @Summary (R13 anti-pattern) -----
  /dup_description:
    get:
      operationId: dup_description.get
      summary: List matters owned by caller
      description: List matters owned by caller.   # same as summary (modulo period) → octo-description-distinct
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'

  # ----- Deprecated without guidance (H anti-pattern) -----
  /deprecated_no_guidance:
    get:
      operationId: deprecated_no_guidance.get
      summary: Old endpoint
      description: This endpoint is old.        # no replacement/removal info → octo-deprecated-needs-guidance
      deprecated: true
      tags: [matter]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_Data'
